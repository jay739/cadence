name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep=''
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Backend (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend package + dev dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -c constraints.txt -e ".[dev]"

      - name: constraints.txt is in sync with pyproject.toml
        working-directory: backend
        # pip-compile keeps every existing pin that still satisfies pyproject.toml, so this only
        # changes the file when a range moved (e.g. a Dependabot bump) without re-locking.
        run: |
          pip install -q 'pip-tools>=7.4'
          CUSTOM_COMPILE_COMMAND=scripts/lock-backend.sh python -m piptools compile -q --extra dev --strip-extras --output-file constraints.txt pyproject.toml
          git diff --exit-code constraints.txt || { echo "::error::backend/constraints.txt is stale: run scripts/lock-backend.sh and commit the result"; exit 1; }

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: mypy typecheck
        working-directory: backend
        run: mypy app

      - name: Unit + integration tests
        working-directory: backend
        run: pytest tests/unit tests/integration -q --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit (fails on high/critical)
        working-directory: backend
        # --exclude-editable drops the self-installed `cadence` package from the input. Without
        # it, pip freeze reports cadence's source as this (private) repo's own URL, pip-audit
        # tries to git-clone it to resolve the version, and fails with "could not read Username
        # for 'https://github.com'". pip-audit's own --skip-editable does not fix this: run
        # directly against the live env (no -r), it still hard-errors on the editable
        # distribution instead of skipping it, so the fix has to happen on the input side.
        run: pip-audit --strict --desc -r <(pip freeze --exclude-editable)

  ytdlp-shim:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ytdlp-shim (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ytdlp-shim + dev dependencies
        working-directory: ytdlp-shim
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: ytdlp-shim
        run: ruff check app tests

      - name: mypy typecheck
        working-directory: ytdlp-shim
        run: mypy app

      - name: Unit tests
        working-directory: ytdlp-shim
        run: pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Web client (lint, typecheck, build, unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Prettier format check
        working-directory: web
        run: npm run format:check

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build
        working-directory: web
        run: npm run build

      - name: npm audit (fails on high/critical)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    if: needs.changes.outputs.code == 'true'
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: [changes, backend, web]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend package
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -c constraints.txt -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite against demo mode
        working-directory: web
        env:
          CADENCE_PYTHON_BIN: python
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
