[project]
name = "cadence"
version = "0.1.0"
description = "Self-hostable single-track music request service backend"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayakrishna Konda", email = "contact@jay739.dev" }]

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "email-validator>=2.2.0,<3.0",
    "sqlalchemy>=2.0.35,<3.0",
    "aiosqlite>=0.20.0,<1.0",
    "alembic>=1.13.3,<2.0",
    "httpx>=0.27.2,<1.0",
    "passlib[argon2]>=1.7.4,<2.0",
    "argon2-cffi>=23.1.0,<24.0",
    "pyjwt>=2.9.0,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "mutagen>=1.47.0,<2.0",
    "slowapi>=0.1.9,<1.0",
    "tenacity>=9.0.0,<10.0",
    "structlog>=24.4.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-httpx>=0.31.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.12.0,<2.0",
    "pip-audit>=2.7.3,<3.0",
    "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
