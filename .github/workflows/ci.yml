name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package + dev dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: mypy typecheck
        working-directory: backend
        run: mypy app

      - name: Unit + integration tests
        working-directory: backend
        run: pytest tests/unit tests/integration -q --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit (fails on high/critical)
        working-directory: backend
        run: pip-audit --strict --desc -r <(pip freeze) || pip-audit --strict --desc

  web:
    name: Web client (lint, typecheck, build, unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Prettier format check
        working-directory: web
        run: npm run format:check

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build
        working-directory: web
        run: npm run build

      - name: npm audit (fails on high/critical)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite against demo mode
        working-directory: web
        env:
          CADENCE_PYTHON_BIN: python
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
