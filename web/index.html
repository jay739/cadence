<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cadence: a self-hosted service for requesting a single track at a time."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Cadence</title>
    <script>
      // Runs before first paint so a stored theme choice applies immediately, matching the
      // storage key ThemeToggle.tsx writes to. No stored choice: leave the attribute unset
      // and let tokens.css's prefers-color-scheme media query decide.
      (function () {
        try {
          var stored = localStorage.getItem("cadence-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          }
        } catch {
          // Storage inaccessible (private browsing, disabled storage): fall back silently.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
