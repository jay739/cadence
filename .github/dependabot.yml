# Dependabot configuration.
#
# All updates are grouped where possible so we get one PR per ecosystem per
# week instead of one PR per package, fewer rebases, fewer notifications,
# and easier to review against a single test run.

version: 2
updates:
  # ── Python backend (backend/pyproject.toml) ────────────────────────────
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(backend)"

  # ── npm packages (web/package.json) ─────────────────────────────────────
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(web)"

  # ── GitHub Actions used by the workflows ────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
