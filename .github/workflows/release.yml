name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    name: Full validation before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend package + dev dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: mypy typecheck
        working-directory: backend
        run: mypy app

      - name: Backend tests
        working-directory: backend
        run: pytest tests/unit tests/integration -q --cov=app --cov-fail-under=80

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web lint, typecheck, unit tests, build
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite against demo mode
        working-directory: web
        env:
          CADENCE_PYTHON_BIN: python
        run: npx playwright test

  publish:
    name: Build and push multi-arch image, create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
